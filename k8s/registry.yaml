apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-registry
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: private-registry
  template:
    metadata:
      labels:
        app: private-registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: private-registry
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: private-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 6443  # Fixed port for easy access
